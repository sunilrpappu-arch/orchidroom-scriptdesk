server {
    listen 80;
    server_name _;

    # Railway terminates TLS at its edge and forwards the original scheme.
    # Upgrade any plain-http request to https so visitors always get the padlock.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Tell browsers to use https for this host for the next year, so a cached
    # or hand-typed http link never lands on the insecure version again.
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
